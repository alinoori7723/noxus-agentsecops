[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noxus-agentsecops"
version = "0.1.0"
description = "Fail-closed AgentSecOps testbed for evaluating and tuning security controls around LLM application execution"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Ali Noori", email = "62625540+alinoori7723@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Test-only deps. httpx is required by fastapi.testclient (Starlette) for the
# HTTP-level API tests; it is intentionally NOT a runtime dependency.
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
]

[project.scripts]
noxus = "noxus.cli:main"
noxus-api = "noxus.api_server:main"

[project.urls]
Homepage = "https://github.com/alinoori7723/noxus-agentsecops"
Repository = "https://github.com/alinoori7723/noxus-agentsecops"
Issues = "https://github.com/alinoori7723/noxus-agentsecops/issues"
Documentation = "https://github.com/alinoori7723/noxus-agentsecops/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noxus = ["samples/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
