[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noxus-agentsecops"
version = "0.1.0"
description = "Fail-closed AgentSecOps testbed for evaluating and tuning security controls around LLM application execution"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Ali Noori", email = "62625540+alinoori7723@users.noreply.github.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "httpx>=0.27",
    "pytest-cov>=7",
    "ruff>=0.15",
    "mypy>=1.19",
    "types-PyYAML>=6",
    "pip-audit>=2.10",
    "build>=1.4",
    "setuptools>=82",
    "wheel>=0.46",
]

[project.scripts]
noxus = "noxus.cli:main"
noxus-api = "noxus.api_server:main"

[dependency-groups]
build = ["build>=1.4", "setuptools>=82", "wheel>=0.46"]

[project.urls]
Homepage = "https://github.com/alinoori7723/noxus-agentsecops"
Repository = "https://github.com/alinoori7723/noxus-agentsecops"
Issues = "https://github.com/alinoori7723/noxus-agentsecops/issues"
Documentation = "https://github.com/alinoori7723/noxus-agentsecops/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noxus = ["samples/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
files = ["src/noxus"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["noxus"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 88.7

[tool.coverage.xml]
output = "reports/python-coverage.xml"
